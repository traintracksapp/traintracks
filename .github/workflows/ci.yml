name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript tests
        run: if [ -d tests ]; then npm test; else echo "no tests yet"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: if ls pipelines/garmin/test_*.py >/dev/null 2>&1; then npm run test:py; else echo "no Python tests yet"; fi
